name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch changes in new AWS Emulator releases.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: actionlint
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  aws-cli:
    name: AWS CLI (${{ matrix.runner }}, ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04, ubuntu-24.04-arm]
        version: [latest]
        include:
          - runner: ubuntu-latest
            version: '1.0.367'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup AWS Emulator
        id: emulator
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Check outputs and environment
        env:
          REQUESTED_VERSION: ${{ matrix.version }}
          VERSION: ${{ steps.emulator.outputs.version }}
          ENDPOINT_URL: ${{ steps.emulator.outputs.endpoint-url }}
          HEALTH_CHECK_URL: ${{ steps.emulator.outputs.health-check-url }}
          CA_FILE: ${{ steps.emulator.outputs.ca-file }}
          CREDENTIALS_FILE: ${{ steps.emulator.outputs.credentials-file }}
          ACCOUNT_ID: ${{ steps.emulator.outputs.account-id }}
          REGION: ${{ steps.emulator.outputs.region }}
        run: |
          set -x
          test -n "${VERSION}"
          if [[ "${REQUESTED_VERSION}" != "latest" ]]; then test "${VERSION}" = "${REQUESTED_VERSION}"; fi
          test "${ENDPOINT_URL}" = "https://127.0.0.1:9297"
          test "${AWS_ENDPOINT_URL}" = "${ENDPOINT_URL}"
          test "${AWS_CA_BUNDLE}" = "${CA_FILE}"
          test "${AWS_REGION}" = "${REGION}"
          test "${ACCOUNT_ID}" = "000000000000"
          test -s "${CA_FILE}"
          test -s "${CREDENTIALS_FILE}"
          curl --fail --silent --cacert "${CA_FILE}" "${HEALTH_CHECK_URL}"

      - name: Run AWS CLI tests
        run: bash tests/aws-cli.sh

  sdks:
    name: AWS SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup AWS Emulator
        uses: ./

      - name: AWS SDK for Python (Boto3)
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet boto3
          "${RUNNER_TEMP}/venv/bin/python" tests/sdk_python.py

      - name: AWS SDK for JavaScript v3
        run: |
          npm install --silent --no-save --prefix "${RUNNER_TEMP}/node-sdk" @aws-sdk/client-s3 @aws-sdk/client-sts
          NODE_PATH="${RUNNER_TEMP}/node-sdk/node_modules" node tests/sdk_node.cjs

  options:
    name: Options (random port, auth off, no env export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup AWS Emulator
        id: emulator
        uses: ./
        with:
          port: '0'
          auth: 'off'
          export-env: 'false'
          verify-signature: 'false'
          idle-timeout: '600'

      - name: Use outputs directly
        env:
          ENDPOINT_URL: ${{ steps.emulator.outputs.endpoint-url }}
          CA_FILE: ${{ steps.emulator.outputs.ca-file }}
          CREDENTIALS_FILE: ${{ steps.emulator.outputs.credentials-file }}
        run: |
          set -x
          test -z "${AWS_ENDPOINT_URL:-}"
          test -z "${CREDENTIALS_FILE}"
          test "${ENDPOINT_URL}" != "https://127.0.0.1:9297"
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test \
            aws sts get-caller-identity \
              --endpoint-url "${ENDPOINT_URL}" --ca-bundle "${CA_FILE}" --region us-east-1

  unsupported-runner:
    name: Fails clearly on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup AWS Emulator
        id: emulator
        continue-on-error: true
        uses: ./

      - name: Expect failure
        if: steps.emulator.outcome != 'failure'
        run: |
          echo "Expected the action to fail on a non-Linux runner."
          exit 1
